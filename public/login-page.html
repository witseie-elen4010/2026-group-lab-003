<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Consultation Scheduler</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/login-page.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="auth-wrapper w-100" style="max-width: 420px;">
            
            <div class="text-center mb-4">
                <img src="images/synchro-logo.png" alt="Synchro Logo" class="img-fluid mb-2" style="max-width: 200px;">
                <p class="text-white small">Welcome back! Please login to your account</p>
            </div>
            
            <div class="card login-card border-0 shadow-lg">
                <div class="card-body p-4">
                    <h2 class="h4 text-center text-white mb-4 fw-bold">USER LOGIN</h2>

                    <form id="loginForm" novalidate>
                        
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <span class="material-symbols-outlined text-secondary">mail</span>
                                </span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="Email Address" required>
                            </div>
                            <span id="emailError" class="text-danger x-small d-block mt-1"></span>
                        </div>

                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <span class="material-symbols-outlined text-secondary">lock</span>
                                </span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Password" required>
                                
                                <span class="input-group-text bg-white border-start-0" style="cursor: pointer;">
                                    <span id="togglePassword" class="material-symbols-outlined text-dark">visibility</span>
                                </span>
                            </div>
                            <span id="passwordError" class="text-danger x-small d-block mt-1"></span>
                        </div>
                    
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label text-white small" for="remember">
                                    Remember me
                                </label>
                            </div>
                            <a href="forgot-password.html" class="text-warning small text-decoration-none fw-semibold">Forgot password?</a>
                        </div>
                    
                        <div class="d-grid mb-3">
                            <button class="btn btn-warning fw-bold rounded-pill" type="submit" style="height: 45px;">
                                LOGIN
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <p class="text-white small mb-0">
                                Don't have an account? <a href="register-page.html" class="text-warning text-decoration-none fw-semibold">Create a new account.</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-5">
                <small class="text-white-50">Designed by students at the University of the Witwatersrand</small>
            </div>
            
            <p id="message" class="text-center mt-3"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login-page.js"></script>
</body>
</html>

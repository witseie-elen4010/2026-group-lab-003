<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Consultations</title>
    <link rel="stylesheet" href="css/student-dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="schedule-container">
        <header class="schedule-header">
            <div class="header-left">

                <div>
                    <h1>
                        <div class="menu-wrapper">
                            <button id="menu-toggle" class="burger-btn" title="Open Menu">
                                <i class="fas fa-bars"></i>
                            </button>
                            
                            <nav id="side-menu" class="burger-dropdown hidden">
                                <div class="menu-items">
                                    <a href="profile-page.html"><i class="fas fa-user-cog"></i> Profile Settings</a>
                                    <a href="activity-log.html"><i class="fas fa-list-ul"></i> Activity Log</a>
                                    <hr>
                                    <a href="login-page.html" class="sign-out"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
                                </div>
                            </nav>
                        </div>
                        <div class="header-text-group">
                            <i class="fas fa-user-graduate"></i>
                            My Bookings
                        </div>
                    </h1>
                    <p class="header-subtitle">Your upcoming academic support sessions</p>
                </div>
            </div>

            <div class="header-right">
                <button id="refresh-btn" class="btn btn-outline" title="Refresh schedule">
                    <i class="fas fa-sync-alt"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <div class="date-banner">
            <i class="fas fa-calendar-day"></i>
            <span id="current-date">Loading...</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="today-bookings">0</div>
                <div class="stat-label">Today's Bookings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="upcoming-week">0</div>
                <div class="stat-label">Upcoming This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-completed">0</div>
                <div class="stat-label">Total Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="canceled-count">0</div>
                <div class="stat-label">Canceled</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="status-filter"><i class="fas fa-tag"></i> Status</label>
                    <select id="status-filter" class="filter-select">
                        <option value="all">All Bookings</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="completed">Completed</option>
                        <option value="canceled">Canceled</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="course-filter"><i class="fas fa-book"></i> Course</label>
                    <select id="course-filter" class="filter-select">
                        <option value="all">All Courses</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="date-filter"><i class="fas fa-calendar"></i> Date</label>
                    <select id="date-filter" class="filter-select">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="tomorrow">Tomorrow</option>
                        <option value="this-week">This Week</option>
                        <option value="next-week">Next Week</option>
                    </select>
                </div>
                <div class="filter-group flex-grow">
                    <label for="search-input"><i class="fas fa-search"></i> Search</label>
                    <input type="text" id="search-input" class="search-input" placeholder="Search by lecturer or course code...">
                </div>
            </div>
        </div>

        <div class="schedule-list-container">
            <div id="schedule-list" class="schedule-list"></div>
            <div id="empty-state" class="empty-state hidden">
                <i class="fas fa-calendar-times"></i>
                <h3>No Bookings Found</h3>
                <p>You haven't booked any consultations that match your filters.</p>
            </div>
        </div>

        <div class="bottom-actions">
            <button class="join_button" onclick="window.location.href='students-joining.html'">
                Join An Existing Consultation
            </button>

            <button id="create-booking-btn" class="book_button" onclick="window.location.href='booking-page.html'">
                Create New Booking
            </button>
        </div>

    </div>

    <div id="session-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Booking Details</h2>
                <button class="close-btn" id="close-session-modal">&times;</button>
            </div>
            <div id="session-detail-content" class="detail-body">
                </div>
        </div>
    </div>

    <script src="js/student-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Consultations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/student-dashboard.css">
</head>
<body class="bg-light">

    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-7">

                <header class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="dropdown">
                            <button class="btn btn-primary shadow-sm" type="button" id="menu-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-bars"></i>
                            </button>
                            <ul class="dropdown-menu shadow border-0" id="side-menu">
                                <li><a class="dropdown-item py-2" href="profile-page.html"><i class="fas fa-user-cog me-2"></i> Profile Settings</a></li>
                                <li><a class="dropdown-item py-2" href="activity-log.html"><i class="fas fa-list-ul me-2"></i> Activity Log</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item py-2 text-danger" href="login-page.html"><i class="fas fa-sign-out-alt me-2"></i> Sign Out</a></li>
                            </ul>
                        </div>

                        <div>
                            <h1 class="h3 mb-0 fw-bold text-white"><i class="fas fa-user-graduate text-warning me-2"></i>My Bookings</h1>
                            <p class="small text-white-50 mb-0">Your upcoming academic support sessions</p>
                        </div>
                    </div>

                    <button id="refresh-btn" class="btn btn-outline-light rounded-pill px-4 shadow-sm">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </header>

                <a href="calendar-page.html" class="text-decoration-none">
                    <div class="card glass-card border-0 mb-4 hover-lift">
                        <div class="card-body py-3 d-flex align-items-center gap-3 text-white">
                            <i class="fas fa-calendar-day text-warning fs-4"></i>
                            <span id="current-date" class="fw-semibold">Loading...</span>
                        </div>
                    </div>
                </a>

                <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">
                    <div class="col">
                        <div class="card glass-card border-0 text-center py-3 h-100">
                            <div class="h2 fw-bold text-warning mb-0" id="today-bookings">0</div>
                            <div class="small text-white-50 text-uppercase tracking-wider">Today</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card glass-card border-0 text-center py-3 h-100">
                            <div class="h2 fw-bold text-warning mb-0" id="upcoming-week">0</div>
                            <div class="small text-white-50 text-uppercase">This Week</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card glass-card border-0 text-center py-3 h-100">
                            <div class="h2 fw-bold text-warning mb-0" id="total-completed">0</div>
                            <div class="small text-white-50 text-uppercase">Completed</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card glass-card border-0 text-center py-3 h-100">
                            <div class="h2 fw-bold text-warning mb-0" id="canceled-count">0</div>
                            <div class="small text-white-50 text-uppercase">Canceled</div>
                        </div>
                    </div>
                </div>

                <div class="card glass-card border-0 mb-4">
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label text-white small fw-bold text-uppercase"><i class="fas fa-tag text-warning me-1"></i> Status</label>
                                <select id="status-filter" class="form-select rounded-3">
                                    <option value="all">All Bookings</option>
                                    <option value="upcoming">Upcoming</option>
                                    <option value="ongoing">Ongoing</option>
                                    <option value="completed">Completed</option>
                                    <option value="canceled">Canceled</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-white small fw-bold text-uppercase"><i class="fas fa-book text-warning me-1"></i> Course</label>
                                <select id="course-filter" class="form-select rounded-3">
                                    <option value="all">All Courses</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-white small fw-bold text-uppercase"><i class="fas fa-calendar text-warning me-1"></i> Date</label>
                                <select id="date-filter" class="form-select rounded-3">
                                    <option value="all">All Dates</option>
                                    <option value="today">Today</option>
                                    <option value="tomorrow">Tomorrow</option>
                                    <option value="this-week">This Week</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-white small fw-bold text-uppercase"><i class="fas fa-search text-warning me-1"></i> Search</label>
                                <input type="text" id="search-input" class="form-control rounded-3" placeholder="Search lecturer or course...">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card glass-card border-0 mb-4 scrollable-schedule overflow-y-auto">
                    <div class="card-body p-3">
                        <div id="schedule-list" class="d-flex flex-column gap-3"></div>
                        
                        <div id="empty-state" class="text-center py-5 hidden">
                            <i class="fas fa-calendar-times text-white-50 fs-1 mb-3"></i>
                            <h3 class="text-white h5">No Bookings Found</h3>
                            <p class="text-white-50 small">Try adjusting your filters.</p>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-5">
                    <div class="col-md-6">
                        <button class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow" onclick="window.location.href='students-joining.html'">
                            JOIN EXISTING CONSULTATION
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button id="create-booking-btn" class="btn btn-warning w-100 py-3 fw-bold rounded-pill shadow" onclick="window.location.href='booking-page.html'">
                            CREATE NEW BOOKING
                        </button>
                    </div>
                </div>

            </div> </div> </div> <div class="modal fade" id="session-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">Booking Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-0" id="session-detail-content"></div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/student-dashboard.js"></script>
</body>
</html>

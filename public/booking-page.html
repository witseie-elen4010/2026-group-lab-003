<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation</title>
    <link rel="stylesheet" href="css/booking-page.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>

    <div class="container">
        <div class="booking-container">
            
            <div class="page-header">
                <a href="student-dashboard.html" class="back-btn" title="Back to Dashboard">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h2 class="mb-0">Book a Consultation</h2>
            </div>

            <form id="newBookingForm">
                
                <div class="col-md-6">
                    <label for="module" class="form-label fw-bold">Module <span class="text-danger">*</span></label>
                    <select class="form-select" id="module" required>
                        <option value="" selected disabled>Loading modules...</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="lecturerId" class="form-label fw-bold">Lecturer <span class="text-danger">*</span></label>
                    <select class="form-select" id="lecturerId" required disabled>
                        <option value="" selected disabled>Select module first...</option>
                    </select>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="bookingDate" class="form-label fw-bold">Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="bookingDate" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Available Time Slots <span class="text-danger">*</span></label>
                    <div id="time-slots-container" class="time-slots-grid">
                        <div class="text-muted small">Please select a date and lecturer to view available times.</div>
                    </div>
                    <input type="hidden" id="selectedStartTime" required>
                    <input type="hidden" id="selectedEndTime" required>
                </div>

                <div class="mb-4">
                    <label for="topic" class="form-label fw-bold">What do you need help with? <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="topic" rows="3" placeholder="Briefly describe the topic or problem..." required></textarea>
                </div>

                <button type="submit" class="book_button">
                    <i class="fas fa-calendar-check me-2"></i> Confirm Booking
                </button>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/booking-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Availability | Synchro v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/lecturer-availability-v2.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="images/synchro-logo.png" alt="Logo">
            </div>
            <nav class="sidebar-nav">
                <a href="lecturer-dashboard-v2.html"><i class="fas fa-home"></i></a>
                <a href="#" class="active"><i class="fas fa-calendar-plus"></i></a>
                <a href="activity-log.html"><i class="fas fa-list-ul"></i></a>
                <div class="nav-spacer"></div>
                <a href="login-page.html" class="logout"><i class="fas fa-sign-out-alt"></i></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div>
                    <h1 class="greeting">Set Availability</h1>
                    <p class="text-muted">Define your weekly consultation hours. Students book into these time blocks.</p>
                </div>
                <div class="header-actions">
                    <button type="button" id="resetBtn" class="minimal-btn-outline"><i class="fas fa-undo"></i> Reset</button>
                    <button type="submit" id="saveBtn" form="availabilityForm" class="minimal-btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                </div>
            </header>

            <form id="availabilityForm" class="content-grid">
                <!-- LEFT: Settings Panel -->
                <div class="settings-panel">
                    <div class="glass-card">
                        <h3><i class="fas fa-cog"></i> Session Rules</h3>
                        <div class="input-group-minimal">
                            <label>Courses You Teach</label>
                            <div id="courseList" class="course-checkbox-group">
                                <span style="color: #94a3b8; font-size:0.85rem;">Loading courses...</span>
                            </div>
                        </div>
                        <!-- Add Course form -->
                        <div class="input-group-minimal" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; margin-top: 8px;">
                            <label style="font-weight: 700; color: var(--gold-accent); font-size: 0.9rem;">
                                <i class="fas fa-plus-circle"></i> Add New Course
                            </label>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
                                <input type="text" id="newCourseCode" class="form-control-minimal" placeholder="e.g. ELEN4050" style="flex: 1; min-width: 120px; text-transform: uppercase;">
                                <input type="text" id="newCourseName" class="form-control-minimal" placeholder="Course name" style="flex: 2; min-width: 160px;">
                            </div>
                            <button type="button" id="addCourseBtn" class="btn-action" style="margin-top: 8px; width: 100%; padding: 8px; font-size: 0.85rem;">
                                <i class="fas fa-plus"></i> Add Course
                            </button>
                            <div id="addCourseStatus" style="font-size: 0.8rem; margin-top: 6px; min-height: 20px;"></div>
                        </div>
                        <div class="input-group-minimal">
                            <label>Max Students / Slot</label>
                            <input type="number" id="slotCapacity" class="form-control-minimal" value="1" min="1">
                        </div>
                        <div class="input-group-minimal">
                            <label>Max Bookings / Day</label>
                            <input type="number" id="dailySessionLimit" class="form-control-minimal" value="10" min="1">
                        </div>
                    </div>

                    <div class="glass-card mt-4">
                        <h3><i class="fas fa-eye"></i> Live Preview</h3>
                        <div id="preview" class="preview-text">
                            <span style="color: #94a3b8;">No availability set. Toggle a day and set your hours.</span>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Day-Based Availability Grid -->
                <div class="slots-panel">
                    <div class="section-header">
                        <h2><i class="fas fa-calendar-week"></i> Weekly Schedule</h2>
                        <span class="badge-subtle">Toggle each day you're available</span>
                    </div>

                    <div id="dayGrid" class="day-grid">
                        <!-- Monday -->
                        <div class="day-card" data-day="mon">
                            <div class="day-card-header">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-mon" class="day-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="day-name">Monday</span>
                            </div>
                            <div class="day-card-body">
                                <div class="day-slots-container" data-day="mon">
                                    <div class="time-slot-row">
                                        <div class="time-pair">
                                            <div class="time-field">
                                                <label>From</label>
                                                <input type="time" class="form-control-minimal time-input slot-start" value="09:00" disabled>
                                            </div>
                                            <div class="time-field">
                                                <label>To</label>
                                                <input type="time" class="form-control-minimal time-input slot-end" value="16:00" disabled>
                                            </div>
                                        </div>
                                        <button type="button" class="remove-slot-btn" title="Remove slot" style="display:none;">&times;</button>
                                    </div>
                                </div>
                                <button type="button" class="add-slot-btn"><i class="fas fa-plus"></i> Add Time Slot</button>
                            </div>
                        </div>

                        <!-- Tuesday -->
                        <div class="day-card" data-day="tue">
                            <div class="day-card-header">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-tue" class="day-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="day-name">Tuesday</span>
                            </div>
                            <div class="day-card-body">
                                <div class="day-slots-container" data-day="tue">
                                    <div class="time-slot-row">
                                        <div class="time-pair">
                                            <div class="time-field">
                                                <label>From</label>
                                                <input type="time" class="form-control-minimal time-input slot-start" value="09:00" disabled>
                                            </div>
                                            <div class="time-field">
                                                <label>To</label>
                                                <input type="time" class="form-control-minimal time-input slot-end" value="16:00" disabled>
                                            </div>
                                        </div>
                                        <button type="button" class="remove-slot-btn" title="Remove slot" style="display:none;">&times;</button>
                                    </div>
                                </div>
                                <button type="button" class="add-slot-btn"><i class="fas fa-plus"></i> Add Time Slot</button>
                            </div>
                        </div>

                        <!-- Wednesday -->
                        <div class="day-card" data-day="wed">
                            <div class="day-card-header">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-wed" class="day-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="day-name">Wednesday</span>
                            </div>
                            <div class="day-card-body">
                                <div class="day-slots-container" data-day="wed">
                                    <div class="time-slot-row">
                                        <div class="time-pair">
                                            <div class="time-field">
                                                <label>From</label>
                                                <input type="time" class="form-control-minimal time-input slot-start" value="09:00" disabled>
                                            </div>
                                            <div class="time-field">
                                                <label>To</label>
                                                <input type="time" class="form-control-minimal time-input slot-end" value="16:00" disabled>
                                            </div>
                                        </div>
                                        <button type="button" class="remove-slot-btn" title="Remove slot" style="display:none;">&times;</button>
                                    </div>
                                </div>
                                <button type="button" class="add-slot-btn"><i class="fas fa-plus"></i> Add Time Slot</button>
                            </div>
                        </div>

                        <!-- Thursday -->
                        <div class="day-card" data-day="thu">
                            <div class="day-card-header">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-thu" class="day-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="day-name">Thursday</span>
                            </div>
                            <div class="day-card-body">
                                <div class="day-slots-container" data-day="thu">
                                    <div class="time-slot-row">
                                        <div class="time-pair">
                                            <div class="time-field">
                                                <label>From</label>
                                                <input type="time" class="form-control-minimal time-input slot-start" value="09:00" disabled>
                                            </div>
                                            <div class="time-field">
                                                <label>To</label>
                                                <input type="time" class="form-control-minimal time-input slot-end" value="16:00" disabled>
                                            </div>
                                        </div>
                                        <button type="button" class="remove-slot-btn" title="Remove slot" style="display:none;">&times;</button>
                                    </div>
                                </div>
                                <button type="button" class="add-slot-btn"><i class="fas fa-plus"></i> Add Time Slot</button>
                            </div>
                        </div>

                        <!-- Friday -->
                        <div class="day-card" data-day="fri">
                            <div class="day-card-header">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="toggle-fri" class="day-toggle">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="day-name">Friday</span>
                            </div>
                            <div class="day-card-body">
                                <div class="day-slots-container" data-day="fri">
                                    <div class="time-slot-row">
                                        <div class="time-pair">
                                            <div class="time-field">
                                                <label>From</label>
                                                <input type="time" class="form-control-minimal time-input slot-start" value="09:00" disabled>
                                            </div>
                                            <div class="time-field">
                                                <label>To</label>
                                                <input type="time" class="form-control-minimal time-input slot-end" value="16:00" disabled>
                                            </div>
                                        </div>
                                        <button type="button" class="remove-slot-btn" title="Remove slot" style="display:none;">&times;</button>
                                    </div>
                                </div>
                                <button type="button" class="add-slot-btn"><i class="fas fa-plus"></i> Add Time Slot</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>

    <script src="js/revamped/lecturer-availability-v2.js"></script>
</body>
</html>

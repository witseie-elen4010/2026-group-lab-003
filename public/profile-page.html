<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="css/profile-page.css">
</head>
<body>
  <div class="profile-card">
    <h2><span>👤</span> My Profile</h2>
    <form id="profileForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="text" id="surname" placeholder="Surname" required>
      <input type="tel" id="phone" placeholder="Phone (optional)">
      <label class="toggle">
        <input type="checkbox" id="notificationsToggle" checked>
        <span>Email Notifications</span>
      </label>
      <button type="submit">Save Changes</button>
      <a href="dashboard.html" class="cancel-link">Cancel</a>
    </form>
     <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.2);">
  <button type="button" id="showChangePwdBtn" class="change-pwd-btn">Change Password</button>

  <div id="changePwdForm" style="display: none; margin-top: 20px;">
    <input type="password" id="currentPassword" placeholder="Current Password">
    <input type="password" id="newPassword" placeholder="New Password">
    <input type="password" id="confirmNewPassword" placeholder="Confirm New Password">
    <button type="button" id="submitPwdChange" class="submit-pwd-btn">Update Password</button>
    <button type="button" id="cancelPwdChange" class="cancel-pwd-btn">Cancel</button>
  </div>
    <div id="message" class="message"></div>
  </div>
    <script src="js/profile-page.js"></script>
</body>
</html>

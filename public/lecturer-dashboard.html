<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule</title>
    <link rel="stylesheet" href="css/lecturer-dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="schedule-container">
        <header class="schedule-header">
            <div class="header-left">
                <div>
                    <h1>
                        <div class="menu-wrapper">
                            <button id="menu-toggle" class="burger-btn" title="Open Menu">
                                <i class="fas fa-bars"></i>
                            </button>
                            
                            <nav id="side-menu" class="burger-dropdown hidden">
                                <div class="menu-items">
                                    <a href="profile-page.html"><i class="fas fa-user-cog"></i> Profile Settings</a>
                                    <a href="lecturer-activity-log.html"><i class="fas fa-list-ul"></i> Activity Log</a>
                                    <hr>
                                    <a href="login-page.html" class="sign-out"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
                                </div>
                            </nav>
                        </div>
                        <div class="header-text-group">
                            <i class="fas fa-user-graduate"></i>
                            <span id="booking-title"> Schedule</span>
                        </div>
                    </h1>
                    <p class="header-subtitle">Upcoming Consultations</p>
                </div>
            </div>
            <div class="header-right">
                <button id="availability-btn" class="btn text-white" title="Set Availability" onclick="window.location.href='/lecturer-availability.html'">
                   <i class="fas fa-clock"></i>
                   <span>Availability</span>
                </button>
                <button id="refresh-btn" class="btn text-white" title="Refresh schedule">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
            </div>
        </header>

        <a href="calendar-page.html" class="banner-link" style="text-decoration: none; color: inherit;">
            <div class="date-banner">
                <i class="fas fa-calendar-day"></i>
                <span id="current-date">Loading...</span>
            </div>
        </a>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-sessions">0</div>
                <div class="stat-label">Today's Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-joined">0</div>
                <div class="stat-label">Students Joined</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="upcoming-count">0</div>
                <div class="stat-label">Upcoming This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completed-today">0</div>
                <div class="stat-label">Completed Today</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="status-filter">
                        <i class="fas fa-tag"></i> Status
                    </label>
                    <select id="status-filter" class="filter-select">
                        <option value="all">All Sessions</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="completed">Completed</option>
                        <option value="canceled">Canceled</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="course-filter">
                        <i class="fas fa-book"></i> Course
                    </label>
                    <select id="course-filter" class="filter-select">
                        <option value="all">All Courses</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="date-filter">
                        <i class="fas fa-calendar"></i> Date
                    </label>
                    <select id="date-filter" class="filter-select">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="tomorrow">Tomorrow</option>
                        <option value="this-week">This Week</option>
                        <option value="next-week">Next Week</option>
                    </select>
                </div>

                <div class="filter-group flex-grow">
                    <label for="search-input">
                        <i class="fas fa-search"></i> Search
                    </label>
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Search by student name or course code..."
                    >
                </div>
            </div>
        </div>

        <div class="schedule-list-container">
            <div id="schedule-list" class="schedule-list">
                </div>

            <div id="empty-state" class="empty-state hidden">
                <i class="fas fa-calendar-check"></i>
                <h3>No Sessions Scheduled</h3>
                <p>Your upcoming consultations will appear here once students book sessions.</p>
            </div>
        </div>
    </div>

    <div id="session-modal" class="session-modal-overlay hidden" aria-hidden="true">
        <div class="session-modal-panel">
            <div class="session-modal-header">
                <h2>Session Details</h2>
                <button class="close-btn" id="close-session-modal">&times;</button>
            </div>
            <div id="session-detail-content" class="detail-body">
                </div>
        </div>
    </div>

    <script src="js/lecturer-dashboard.js"></script>
</body>
</html>

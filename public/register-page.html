<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Consultation Scheduler</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/register-page.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="auth-wrapper w-100" style="max-width: 450px;">
            
            <div class="text-center mb-4">
                <h1 class="text-white fw-bold h2">Create an Account</h1>
            </div>

            <div class="card register-card border-0 shadow-lg">
                <div class="card-body p-4">
                    <form id="registrationForm" novalidate>
                        
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control rounded-pill" id="name" placeholder="Name" required>
                                <span id="nameError" class="text-danger x-small mt-1 d-block ms-2"></span>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control rounded-pill" id="surname" placeholder="Surname" required>
                                <span id="surnameError" class="text-danger x-small mt-1 d-block ms-2"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="text" class="form-control rounded-pill" id="idNumber" placeholder="Student/Lecturer Number" required>
                            <span id="studnoError" class="text-danger x-small mt-1 d-block ms-2"></span>
                        </div>

                        <div class="mb-3">
                            <input type="email" class="form-control rounded-pill" id="email" placeholder="Email Address" required>
                            <span id="emailError" class="text-danger x-small mt-1 d-block ms-2"></span>
                        </div>

                        <div class="mb-4">
                            <div class="btn-group w-100 rounded-pill p-1 bg-light shadow-sm" role="group" id="role">
                                <input type="radio" class="btn-check" name="roleOptions" id="roleStudent" value="student" checked>
                                <label class="btn btn-outline-primary border-0 rounded-pill fw-bold" for="roleStudent">Student</label>

                                <input type="radio" class="btn-check" name="roleOptions" id="roleLecturer" value="lecturer">
                                <label class="btn btn-outline-primary border-0 rounded-pill fw-bold" for="roleLecturer">Lecturer</label>
                            </div>
                        </div>

                        <div class="mb-3 d-none" id="titleFieldContainer">
                            <label class="form-label text-white small ms-2 fw-semibold">Lecturer Title</label>
                            <div class="btn-group w-100 rounded-pill p-1 bg-light shadow-sm" role="group" id="titleGroup">
                                <input type="radio" class="btn-check" name="titleOptions" id="titleMr" value="Mr">
                                <label class="btn btn-outline-secondary border-0 rounded-pill btn-sm fw-semibold" for="titleMr">Mr</label>

                                <input type="radio" class="btn-check" name="titleOptions" id="titleMrs" value="Mrs">
                                <label class="btn btn-outline-secondary border-0 rounded-pill btn-sm fw-semibold" for="titleMrs">Mrs</label>

                                <input type="radio" class="btn-check" name="titleOptions" id="titleMiss" value="Miss">
                                <label class="btn btn-outline-secondary border-0 rounded-pill btn-sm fw-semibold" for="titleMiss">Miss</label>

                                <input type="radio" class="btn-check" name="titleOptions" id="titleDr" value="Dr">
                                <label class="btn btn-outline-secondary border-0 rounded-pill btn-sm fw-semibold" for="titleDr">Dr</label>

                                <input type="radio" class="btn-check" name="titleOptions" id="titleProf" value="Prof">
                                <label class="btn btn-outline-secondary border-0 rounded-pill btn-sm fw-semibold" for="titleProf">Prof</label>
                            </div>
                            <span id="titleError" class="text-danger x-small mt-1 d-block ms-2"></span>
                        </div>

                        <div class="mb-3">
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0 rounded-start-pill ps-3" id="password" placeholder="Password" required>
                                <span class="input-group-text bg-white border-start-0 rounded-end-pill pe-3">
                                    <span id="togglePassword1" class="material-symbols-outlined text-dark" style="cursor: pointer;">visibility</span>
                                </span>
                            </div>
                            <span id="passwordError" class="text-danger x-small mt-1 d-block ms-2"></span>
                        </div>

                        <div class="mb-3">
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0 rounded-start-pill ps-3" id="confirmPassword" placeholder="Confirm Password" required>
                                <span class="input-group-text bg-white border-start-0 rounded-end-pill pe-3">
                                    <span id="togglePassword2" class="material-symbols-outlined text-dark" style="cursor: pointer;">visibility</span>
                                </span>
                            </div>
                        </div>

                        <span id="error-message" class="text-danger x-small d-block text-center mb-3"></span>

                        <div class="d-grid mb-3">
                            <button class="btn btn-warning fw-bold rounded-pill py-2" type="submit">REGISTER</button>
                        </div>

                        <div class="text-center">
                            <p class="text-white small mb-0">
                                Already have an account? <a href="login-page.html" class="text-warning text-decoration-none fw-semibold">Login here.</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register-page.js"></script>
</body>
</html>

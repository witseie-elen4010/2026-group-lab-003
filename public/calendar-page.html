<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/calendar-page.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                
                <div class="mb-3">
                    <a id="dashboard-back-btn" href="#" class="btn btn-white bg-white text-secondary shadow-sm border-0 rounded-pill px-4 py-2 small fw-semibold text-decoration-none">
                        <i class="fas fa-arrow-left me-2 text-primary"></i> Back to Dashboard
                    </a>
                </div>
                
                <div class="card shadow-sm border-0">
                    
                    <div class="card-header bg-white py-3 border-bottom-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <button id="prev-month" class="btn btn-outline-primary border-0" aria-label="Previous Month">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            
                            <h2 id="month-display" class="h4 mb-0 fw-bold text-dark text-uppercase">Loading...</h2>
                            
                            <button id="next-month" class="btn btn-outline-primary border-0" aria-label="Next Month">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="card-body p-0">
                        <div class="d-flex bg-primary text-white text-center py-2 fw-bold">
                            <div class="flex-fill">Sun</div>
                            <div class="flex-fill">Mon</div>
                            <div class="flex-fill">Tue</div>
                            <div class="flex-fill">Wed</div>
                            <div class="flex-fill">Thu</div>
                            <div class="flex-fill">Fri</div>
                            <div class="flex-fill">Sat</div>
                        </div>

                        <div id="days-grid" class="days-grid-layout"></div>
                    </div>
                    
                </div> 
                
                <div class="mt-3 d-flex justify-content-center gap-3 small text-muted">
                    <span><i class="fas fa-circle text-primary me-1"></i> Scheduled</span>
                    <span><i class="fas fa-circle text-secondary me-1"></i> Today</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const backBtn = document.getElementById("dashboard-back-btn");
            
            // Fetch the logged-in user from storage
            const userData = sessionStorage.getItem("sychro_current_user") || localStorage.getItem("sychro_current_user");
            
            if (userData) {
                const user = JSON.parse(userData);
                
                // Route based on role property (adjust 'student' vs 'lecturer' values to match your DB schema)
                if (user.role === 'lecturer' || user.isLecturer) {
                    backBtn.href = "lecturer-dashboard.html";
                } else {
                    backBtn.href = "student-dashboard.html"; 
                }
            } else {
                // Fallback safety route if user data is missing
                backBtn.href = "login-page.html";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/calendar-page.js"></script>
</body>
</html>

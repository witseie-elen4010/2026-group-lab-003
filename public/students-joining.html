<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sychro - Join Sessions</title>
    <link rel="stylesheet" href="css/students-joining.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="student-container">
        <header class="student-header">
            <div class="header-left">
                <h1><i class="fas fa-users"></i> Peer Sessions</h1>
                <p class="header-subtitle mb-2">Join a classmate's consultation</p>
                
                <a href="student-dashboard.html" class="btn btn-glass text-white text-decoration-none rounded-pill px-3 py-1 small fw-semibold shadow-sm d-inline-block mt-2">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
            
            <div class="header-right d-flex align-items-center">
                <button id="refresh-btn" class="btn btn-outline">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </header>

        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="course-filter"><i class="fas fa-book"></i> Course</label>
                    <select id="course-filter" class="filter-select">
                        <option value="all">All Courses</option>
                    </select>
                </div>
                <div class="filter-group flex-grow">
                    <label for="search-input"><i class="fas fa-search"></i> Search</label>
                    <input type="text" id="search-input" class="search-input" placeholder="Search by topic or student name...">
                </div>
            </div>
        </div>

        <div class="sessions-container">
            <div id="sessions-list" class="sessions-list"></div>
            <div id="empty-state" class="empty-state hidden">
                <i class="fas fa-calendar-times"></i>
                <h3>No sessions available</h3>
                <p>Check back later for peer consultations to join.</p>
            </div>
        </div>
    </div>

    <script src="js/students-joining.js"></script>
</body>
</html>
